
- name: Configure AI Interview Coach app tier
  hosts: all
  become: true
  vars:
    app_dir: /opt/icoach-app
    app_user: icoach
    repo_url: https://github.com/kamaldeepsingh039/ai-interview-coach.git

  tasks:
    - name: Install Python 3, pip, and git
      ansible.builtin.dnf:
        name:
          - python3
          - python3-pip
          - git
        state: present

    - name: Create dedicated app user (no login shell — least privilege, not root/ec2-user)
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /sbin/nologin
        create_home: false

    - name: Clone application repo
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main

    - name: Create virtual environment and install app dependencies (includes Gunicorn now)
      ansible.builtin.pip:
        requirements: "{{ app_dir }}/requirements.txt"
        virtualenv: "{{ app_dir }}/venv"
        virtualenv_command: python3 -m venv

    - name: Set app directory ownership
      ansible.builtin.file:
        path: "{{ app_dir }}"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        recurse: true

    - name: Create log directory for Gunicorn
      ansible.builtin.file:
        path: /var/log/icoach-app
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: '0755'

    - name: Install Gunicorn systemd service
      ansible.builtin.copy:
        src: files/gunicorn.service
        dest: /etc/systemd/system/gunicorn.service
        mode: '0644'

    - name: Enable Gunicorn on boot (not started now — Secrets Manager calls need the real IAM role, only present at actual launch, not during the Packer build)
      ansible.builtin.systemd:
        name: gunicorn
        enabled: true
        daemon_reload: true

    - name: Install CloudWatch agent
      ansible.builtin.dnf:
        name: amazon-cloudwatch-agent
        state: present

    - name: Copy CloudWatch agent config
      ansible.builtin.copy:
        src: files/cloudwatch-config.json
        dest: /opt/aws/amazon-cloudwatch-agent/etc/config.json

    - name: Load CloudWatch agent config (does not start it now — same IAM-role timing reason as Gunicorn above)
      ansible.builtin.command:
        cmd: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/config.json

    - name: Enable CloudWatch agent on boot (starts at instance launch, not during the Packer build)
      ansible.builtin.systemd:
        name: amazon-cloudwatch-agent
        enabled: true

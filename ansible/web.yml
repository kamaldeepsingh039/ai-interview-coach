
- name: Configure AI Interview Coach web tier
  hosts: all
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Copy nginx configuration
      ansible.builtin.copy:
        src: files/nginx.conf
        dest: /etc/nginx/nginx.conf
        mode: '0644'

    - name: Enable nginx on boot (not started now — config still has a placeholder ALB address, replaced by user_data at real launch)
      ansible.builtin.systemd:
        name: nginx
        enabled: true

    - name: Install CloudWatch agent
      ansible.builtin.dnf:
        name: amazon-cloudwatch-agent
        state: present

    - name: Copy CloudWatch agent config
      ansible.builtin.copy:
        src: files/nginx-cloudwatch-config.json
        dest: /opt/aws/amazon-cloudwatch-agent/etc/config.json

    - name: Load CloudWatch agent config
      ansible.builtin.command:
        cmd: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/etc/config.json

    - name: Enable CloudWatch agent on boot
      ansible.builtin.systemd:
        name: amazon-cloudwatch-agent
        enabled: true

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Interview Coach</title>
  <!-- Static assets served from S3 through CloudFront, not by Flask/Nginx.
       "v2" is a versioned path so this can go live without colliding with
       whatever's already sitting in the S3 bucket. -->
  <link rel="stylesheet" href="https://d1927xzamfh4ps.cloudfront.net/static/v2/style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand">
        <span class="brand-mark">IC</span>
        <span class="brand-name">AI Interview Coach</span>
      </div>
      <p class="tagline">Practice real questions. Get real feedback.</p>
    </header>

    <main class="card">
      <section class="step" id="role-step">
        <label class="step-label" for="role-select">1. Pick a role</label>
        <select id="role-select" class="role-select" disabled>
          <option value="">Loading roles…</option>
        </select>
        <button id="get-question-btn" class="btn btn-primary" disabled>
          Get a question
        </button>
      </section>

      <section class="step hidden" id="question-step">
        <label class="step-label">2. Your question</label>
        <p id="question-text" class="question-text"></p>

        <label class="step-label" for="answer-input">3. Your answer</label>
        <textarea
          id="answer-input"
          class="answer-input"
          rows="6"
          placeholder="Type your answer here — treat it like you're actually in the interview."
        ></textarea>

        <div class="actions">
          <button id="submit-answer-btn" class="btn btn-primary">
            Submit answer
          </button>
          <button id="new-question-btn" class="btn btn-ghost">
            New question
          </button>
        </div>
      </section>

      <section class="step hidden" id="feedback-step">
        <label class="step-label">Feedback</label>
        <div id="feedback-loading" class="feedback-loading hidden">
          <span class="spinner"></span> Thinking it over…
        </div>
        <div id="feedback-text" class="feedback-text"></div>
        <div class="actions">
          <button id="try-again-btn" class="btn btn-ghost">
            Try another question
          </button>
        </div>
      </section>

      <p id="error-banner" class="error-banner hidden"></p>
    </main>

    <footer class="footer">
      Built by Kamaldeep Singh &middot; Flask + Gemini, deployed on a
      hand-built three-tier AWS architecture.
    </footer>
  </div>

  <script src="https://d1927xzamfh4ps.cloudfront.net/static/v2/script.js" defer></script>
</body>
</html>
